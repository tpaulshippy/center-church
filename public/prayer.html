<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Prayer Request | Center Church Gilbert</title>
  <meta name="description" content="Share a prayer request with Center Church in Gilbert, AZ. Your name is optional — our prayer team will be praying for you." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Inter+Tight:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css?v=14" />
  <style>
    .prayer-page {
      min-height: 100dvh;
      background: var(--page);
      color: var(--text);
      padding:
        calc(2.5rem + env(safe-area-inset-top)) 1.25rem
        calc(2rem + env(safe-area-inset-bottom));
    }
    .prayer-wrap { width: 100%; max-width: 520px; margin: 0 auto; text-align: center; }
    .prayer-logo {
      width: 200px; max-width: 60vw; height: auto;
      margin: 0 auto; display: block;
    }
    .prayer-title {
      font-family: var(--font-display);
      font-weight: 800;
      letter-spacing: -0.02em;
      font-size: clamp(1.9rem, 6vw, 2.6rem);
      line-height: 1.05;
      margin-top: 1.25rem;
      text-wrap: balance;
    }
    .prayer-sub { margin-top: 0.6rem; color: var(--text-2); font-size: 1.02rem; }
    .prayer-card {
      margin-top: 1.75rem;
      text-align: left;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 2px 10px var(--shadow);
      padding: 1.4rem 1.25rem;
    }
    .prayer-field { margin-bottom: 1.1rem; }
    .prayer-field:last-of-type { margin-bottom: 0; }
    .prayer-label {
      display: block;
      font-weight: 700;
      font-size: 0.92rem;
      margin-bottom: 0.4rem;
    }
    .prayer-label small { font-weight: 400; color: var(--text-2); }
    .prayer-input,
    .prayer-textarea {
      width: 100%;
      font: inherit;
      color: var(--text);
      background: var(--page);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem 0.95rem;
    }
    .prayer-input:focus-visible,
    .prayer-textarea:focus-visible,
    .prayer-submit:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .prayer-textarea { min-height: 160px; resize: vertical; line-height: 1.55; }
    .prayer-hint {
      margin-top: 0.4rem;
      font-size: 0.82rem;
      color: var(--text-2);
      text-align: right;
    }
    .prayer-error {
      margin-top: 0.5rem;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent);
      min-height: 1.3em;
    }
    .prayer-submit {
      width: 100%;
      margin-top: 1.1rem;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      font-weight: 700; font-size: 1rem;
      padding: 0.95rem 1.9rem;
      border-radius: 999px;
      border: 2px solid transparent;
      cursor: pointer;
      background: var(--text);
      color: var(--page);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .prayer-submit:hover:not(:disabled) { transform: translateY(-2px); }
    .prayer-submit:disabled { opacity: 0.6; cursor: wait; }
    .prayer-status {
      margin-top: 1.1rem;
      border-radius: 12px;
      padding: 0.9rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.5;
      display: none;
    }
    .prayer-status.show { display: block; }
    .prayer-status.success {
      background: var(--page);
      border: 1px solid var(--accent);
      color: var(--text);
    }
    .prayer-status.error {
      background: var(--page);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .prayer-hp {
      position: absolute; left: -9999px; top: auto;
      width: 1px; height: 1px; opacity: 0;
    }
  </style>
</head>
<body>
  <main class="prayer-page">
    <div class="prayer-wrap">
      <img class="prayer-logo brand-logo-dark" src="/logo.png" alt="Center Church — Fixed on Jesus" width="1024" height="381" fetchpriority="high" />
      <h1 class="prayer-title">Prayer Request</h1>
      <p class="prayer-sub">Share as much or as little as you&rsquo;d like &mdash; your name is optional.</p>

      <form class="prayer-card" id="prayer-form" novalidate>
        <div class="prayer-field">
          <label class="prayer-label" for="prayer-name">Name <small>(optional)</small></label>
          <input class="prayer-input" type="text" id="prayer-name" name="name" maxlength="80" autocomplete="name" placeholder="Your name" />
        </div>
        <div class="prayer-field">
          <label class="prayer-label" for="prayer-text">Prayer request</label>
          <textarea class="prayer-textarea" id="prayer-text" name="prayer" maxlength="2000" required placeholder="How can we pray for you?"></textarea>
          <p class="prayer-hint"><span id="prayer-count">0</span> / 2000</p>
        </div>
        <input class="prayer-hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <p class="prayer-error" id="prayer-error" role="alert" aria-live="assertive"></p>
        <button class="prayer-submit" type="submit" id="prayer-submit">Send Prayer Request</button>
        <p class="prayer-status" id="prayer-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <script>
    (function () {
      var form = document.getElementById("prayer-form");
      var nameInput = document.getElementById("prayer-name");
      var prayerInput = document.getElementById("prayer-text");
      var count = document.getElementById("prayer-count");
      var errorEl = document.getElementById("prayer-error");
      var statusEl = document.getElementById("prayer-status");
      var submitBtn = document.getElementById("prayer-submit");
      var MAX = 2000;

      function showStatus(kind, message) {
        statusEl.className = "prayer-status show " + kind;
        statusEl.textContent = message;
      }

      function hideStatus() {
        statusEl.className = "prayer-status";
        statusEl.textContent = "";
      }

      prayerInput.addEventListener("input", function () {
        count.textContent = String(prayerInput.value.length);
      });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        errorEl.textContent = "";
        hideStatus();

        var prayer = prayerInput.value.trim();
        if (!prayer) {
          errorEl.textContent = "Please share your prayer request before sending.";
          prayerInput.focus();
          return;
        }
        if (prayer.length > MAX) {
          errorEl.textContent = "Please keep your request under 2000 characters.";
          prayerInput.focus();
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending\u2026";

        fetch("/api/prayer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: nameInput.value.trim(),
            prayer: prayer,
            company: form.querySelector('input[name="company"]').value
          })
        })
          .then(function (res) {
            if (!res.ok) throw new Error("Request failed");
            showStatus("success", "Thank you \u2014 our prayer team will be praying for you.");
            form.reset();
            count.textContent = "0";
          })
          .catch(function () {
            showStatus("error", "Something went wrong \u2014 please try again later.");
          })
          .finally(function () {
            submitBtn.disabled = false;
            submitBtn.textContent = "Send Prayer Request";
          });
      });
    })();
  </script>
</body>
</html>
